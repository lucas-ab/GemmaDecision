[project]
name = "gemma-decision"
version = "0.1.0"
description = "Clef-style decision model on an EmbeddingGemma-2 encoder"
authors = [
    { name = "Lucas Bessa" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fastapi>=0.115",
    "librosa>=1.0.0",
    "peft>=0.21",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "soundfile>=0.14.0",
    "torch==2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal>=1.6",
    "pytest>=9.1.1",
]

[project.scripts]
gd-train = "gemma_decision.train:main"
gd-eval = "gemma_decision.evaluate:main"
gd-compare = "gemma_decision.compare:main"
gd-mm-build = "gemma_decision.mm_build:main"
gd-mm-eval = "gemma_decision.mm_eval:main"
gd-mm-probe = "gemma_decision.mm_probe:main"
gd-score-external = "gemma_decision.external:main"
gd-pilot-build = "gemma_decision.pilot_build:main"
gd-synth-build = "gemma_decision.synth_build:main"
gd-serve = "gemma_decision.serve:main"
